name: "Release"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


on:
  workflow_call:
    inputs:
      zip_mode:   { type: string, required: true }   # per-variant | aio
      build_type: { type: string, required: true }   # stable

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Download artifacts"
        uses: actions/download-artifact@v4.3.0
        with:
          path: ./artifacts/

      - name: "Resolve versions"
        run: bash scripts/resolve-versions.sh
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}

      - name: "Package ZIPs"
        env:
          ZIP_MODE:   ${{ inputs.zip_mode }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: bash scripts/pack-release.sh

      - name: "Generate release notes"
        env:
          BUILD_TYPE:  ${{ inputs.build_type }}
          RUN_URL:     "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO:        ${{ github.repository }}
          SHA:         ${{ github.sha }}
        run: bash scripts/release-notes.sh

      - name: "Publish release"
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          overwrite: true
          files: |
            ./release_zips/*.zip
          tag_name:   ${{ env.RELEASE_TAG }}
          name:       ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body:       ${{ env.RELEASE_BODY }}

      - name: "Send ZIPs to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHAT_ID:?Missing TELEGRAM_CHAT_ID}"


          for zip in ./release_zips/*.zip; do
            [ -f "$zip" ] || continue
            filename="$(basename "$zip")"
            sha256="$(sha256sum "$zip" | cut -d' ' -f1)"
            hash="${filename#Shibuya-}"
            hash="${hash%%-*}"
            build_date="$(date '+%d/%m/%Y')"
            caption="$(printf "<b>Shibuya Kernel for Rtwo</b>\n\n- LocalVersion: -Shibuya-rc1-%s\n- Clang: Neutron Clang 30072026\n- Build Date: %s\n- Commit hash: <code>%s</code>\n- Compatibility State: AOSP/Stock\n- Manager: <a href=\"https://t.me/kowsu_build\">KowSu</a>\n- SuSFS: Non-Supported" "$hash" "$build_date" "$hash")"
            curl --fail --silent --show-error --retry 3 \
              --output /dev/null \
              --form "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${zip}" \
              --form "parse_mode=HTML" \
              --form-string "caption=${caption}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          done
